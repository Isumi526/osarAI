# 独立レビュー（scripts/independent-review.mjs）の accepted-findings レジストリ。
# ここに載せた finding は report に「accepted(tracked: ticket)」として出るが、
# verdict=block の集計からは除外される（＝人間が把握済み・チケットで追跡中の既知事項）。
# verdict=block になるのは「未acceptの critical/🔴 が1件以上」の時だけ。
#
# entry: { rule, target, reason, ticket }
#   rule   … ルール名（.md は省略可。finding.rule と部分一致で判定）
#   target … 対象（テーブル名/ファイル名等。finding.file か finding.message に含まれれば一致）
#   reason … なぜ未対応で許容しているか
#   ticket … 追跡している Notion ページID（集約先）
#
# ── osarAI 用は空から開始（sido のベースラインは引き継がない）。
#    osarAI は Supabase Auth + org_id/owner_id RLS が初期から有効な認証アプリで、
#    sido の「anon公開キー前提・RLS未適用ベースライン」は存在しないため。
#    既知許容が出たらここに追記する。
entries:
  - rule: rls-multitenant
    target: apps/web/app/api/osarai/turn/route.ts
    reason: >
      誤検知として確認済み（2026-07-15）。指摘は「service role クライアントで
      customer_id のみのWHERE句・テナント分離が無い」というものだが、この関数が
      受け取る supabase は apps/web/lib/api-auth.ts の authedFromRequest() が返す
      anonキー+ユーザー自身のBearerトークンで構築したRLSスコープ済みクライアント
      であり、service_roleは使っていない（同ファイルのコメント「service_role は
      使わない（テナント/owner 分離は RLS に委ねる・§7）」参照）。customers/schedules
      テーブルのRLSポリシー(customers_cud: owner_id=auth.uid() 等)がPostgres側で
      強制されるため、customerIdだけのWHERE句でも他テナントのデータは更新できない。
      Gemini独自レビューの誤判定（クライアント構築箇所を見ずservice_roleと誤認）。
    ticket: 39a0ff81-c56b-81cb-8311-d949f7b034b7
  - rule: rls-multitenant
    target: supabase/migrations/0021_referral_codes.sql
    reason: >
      対応済み・確認済み（2026-07-15）。0021作成時点のreferral_codes_cud/
      agency_products_cudポリシーはusing句にcreated_by=auth.uid()が無く、
      同組織の別leaderが他leaderの行をDELETE/UPDATEできる欠陥があった。
      同一diff内のmigration 0022(agency_products_referral_codes_own_only)で
      両ポリシーをdrop&再作成し作成者本人限定に締め済み。実際に適用される
      最終的なRLSポリシーは0022の内容であり、e2e(agency-products-rls.spec.ts /
      referral-codes-rls.spec.ts)に「別leaderは他leaderの行を削除できない」
      回帰テストを追加しpass確認済み。Geminiは0021単体を見て指摘しているが
      0022で解消されている旨をfinding本文でも認めている。
    ticket: 39d0ff81-c56b-8130-9683-e53dd0a9d2a5
  - rule: migration-safety
    target: supabase/migrations/0024_agency_leader_redesign.sql
    reason: >
      誤検知/ルールの過剰適用として確認済み（2026-07-17）。指摘は
      「DROP CONSTRAINT / DROP POLICY を含む破壊的変更」というものだが、
      migration-safety.md自体の定義は「column削除／rename、default無しの
      NOT NULL追加、既存型の変更(ALTER...TYPE)」を破壊的とするもので、
      CHECK制約の許容値を広げるDROP CONSTRAINT+ADD CONSTRAINT(既存の
      'member'/'leader'や'light'/'standard'/'pro'は引き続き有効な値のまま、
      'agency'/'leader'/'member'を追加するだけ)や、RLSポリシーを修正する
      DROP POLICY+CREATE POLICY(同一migration内で即座に再作成・行やデータは
      一切削除しない)は定義に含まれない。後者のパターンは既存の0022
      (agency_products_referral_codes_own_only)で既に使われており前例がある。
      データ損失は無く、ロールバックもrevert 1コミットで安全(§16 DoD相当)。
    ticket: 39e0ff81-c56b-8172-abbe-e7cc07ebb5bf
  - rule: idempotency
    target: apps/web/app/api/agency-products/route.ts
    reason: >
      既知・許容済み(前チケットで指摘され非ブロックと判断済み)。商品作成APIの
      連打/再送で二重作成されうる指摘だが、クライアント側(AgencyProductsManager.tsx)
      で送信中はボタンをdisabledにするガードが実装済み。DB側unique制約までは
      本チケット(および前チケット)のスコープ外と判断(§0スコープ厳守)。
    ticket: 39e0ff81-c56b-8172-abbe-e7cc07ebb5bf
